<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gap-analysis</title>
<style>
:root{
--indigo:#2D2DD6; --indigo-d:#1C1C8F; --indigo-l:#8A8AEA;
--canvas:#E9ECF4; --panel:#FBFCFE; --panel-2:#F3F5FA;
--ink:#232848; --ink-2:#5D6484; --ink-3:#9AA0B8; --ghost:#C3C8DA;
--line:#D8DCE9; --hair:#E5E8F1;
--red:#E0402A; --red-t:#FCF0EE;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);
font:14px/1.6 "Helvetica Neue",Inter,ui-sans-serif,-apple-system,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.shell{max-width:1180px;margin:0 auto;padding:0 34px 0 62px;position:relative}
.spine{position:fixed;left:16px;top:0;height:100vh;display:flex;align-items:center;z-index:5}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;
letter-spacing:.22em;text-transform:uppercase;color:var(--ghost);white-space:nowrap}
.klabel{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);
font-weight:600;display:flex;align-items:center;gap:7px}
.klabel::before{content:"";width:5px;height:5px;background:var(--indigo);border-radius:50%;flex:none}
.klabel.plain::before{display:none}
/* hero */
.hero{padding:70px 0 46px;position:relative}
h1{font-size:clamp(52px,10vw,120px);line-height:.86;font-weight:600;letter-spacing:-.045em;
color:var(--indigo);margin:22px 0 0;text-transform:lowercase}
.lede{max-width:430px;margin:26px 0 0;color:var(--ink-2);font-size:14px;line-height:1.65}
.lede em{font-family:Georgia,serif;font-style:italic;color:var(--indigo)}
.figs{display:flex;flex-wrap:wrap;gap:0;margin-top:44px;border-top:1px solid var(--line)}
.fig{flex:1 1 130px;padding:16px 18px 18px 0;border-right:1px solid var(--hair);position:relative}
.fig:last-child{border-right:0}
.fig b{display:block;font-size:38px;font-weight:600;letter-spacing:-.045em;line-height:1;
color:var(--indigo);margin-bottom:8px}
.fig.alarm b{color:var(--red)}
.fig span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
/* nav */
nav{position:sticky;top:0;z-index:10;background:rgba(233,236,244,.93);backdrop-filter:blur(10px);
border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;
margin:0 -34px 0 -62px;padding:0 34px 0 62px}
nav a{padding:12px 20px 12px 0;margin-right:20px;border-right:1px solid var(--hair);
color:var(--ink-2);text-decoration:none;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
nav a:last-child{border-right:0}
nav a:hover{color:var(--indigo)}
/* sections */
section{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 28px;
padding:52px 0;border-bottom:1px solid var(--line);position:relative;scroll-margin-top:46px}
section:last-of-type{border-bottom:0}
.rail{position:relative}
.rail .n{font-size:11px;color:var(--ink-3);margin-top:14px;line-height:1.55;max-width:150px}
.ghost{position:absolute;right:-6px;top:-30px;font-size:118px;font-weight:600;letter-spacing:-.06em;
color:var(--indigo);opacity:.055;line-height:1;pointer-events:none;user-select:none}
h2{font-size:29px;font-weight:600;letter-spacing:-.035em;margin:0 0 22px;
color:var(--indigo);text-transform:lowercase;line-height:1.05}
.intro{max-width:640px;color:var(--ink-2);font-size:13.5px;line-height:1.7;margin:0 0 26px}
.intro b{color:var(--ink);font-weight:600}
/* panels + lists */
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:3px;margin-bottom:10px}
.panel.pad{padding:20px 22px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);
font-weight:600;padding:0 16px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:15px 16px 15px 0;font-size:13px;line-height:1.55;border-bottom:1px solid var(--hair);vertical-align:top}
tr:last-child td{border-bottom:0}
td:last-child,th:last-child{padding-right:0}
.ref{font-size:11px;letter-spacing:.06em;color:var(--indigo);font-weight:600;white-space:nowrap}
.ttl{font-weight:600;color:var(--ink);font-size:13.5px;letter-spacing:-.01em}
.dim{color:var(--ink-2);font-size:12.5px;line-height:1.55;margin-top:5px}
.dim2{color:var(--ink-3);font-size:11.5px;margin-top:5px}
.faded{opacity:.42}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
color:var(--ink-3);background:var(--panel-2);padding:1px 5px;border-radius:2px;white-space:nowrap}
.tag{display:inline-block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
padding:3px 9px;border:1px solid var(--line);border-radius:20px;color:var(--ink-3);white-space:nowrap}
.tag.i{border-color:var(--indigo-l);color:var(--indigo)}
.tag.r{border-color:var(--red);color:var(--red)}
.tag.f{background:var(--indigo);border-color:var(--indigo);color:#fff}
.now{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.18em;
text-transform:uppercase;color:var(--red);font-weight:700}
.nw{white-space:nowrap}
/* flow blocks */
.flow{background:var(--panel);border:1px solid var(--hair);border-radius:3px;margin-bottom:14px;overflow:hidden}
.fhd{padding:18px 22px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fhd .ft{font-size:19px;font-weight:600;letter-spacing:-.025em;text-transform:lowercase;flex:1;min-width:180px}
.fbd{padding:6px 14px 16px}
svg.story{display:block;width:100%;height:auto}
.legend{display:flex;gap:20px;flex-wrap:wrap;padding:12px 8px 2px;font-size:10px;
letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.legend i{display:inline-block;width:20px;vertical-align:3px;margin-right:6px}
/* questions */
.qb{margin-bottom:12px}
.qh{display:flex;align-items:baseline;gap:14px;padding:0 0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qh .qn{font-size:17px;font-weight:600;letter-spacing:-.02em;text-transform:lowercase;flex:1;min-width:160px}
.empty{color:var(--ink-3);font-size:13px;font-style:italic}
footer{padding:56px 0 70px;position:relative}
footer .fw{font-size:clamp(38px,8vw,92px);font-weight:600;letter-spacing:-.05em;line-height:.9;
color:var(--indigo);opacity:.13;text-transform:lowercase;margin:30px 0 0}
footer .fn{max-width:520px;color:var(--ink-2);font-size:12.5px;line-height:1.7}
@media print{nav,.spine{display:none}.shell{padding:0}section{break-inside:avoid}}
@media(max-width:820px){
  .shell{padding:0 18px}.spine{display:none}
  nav{margin:0 -18px;padding:0 18px}
  section{grid-template-columns:1fr;gap:14px}
  .ghost{display:none}
  .rail{display:flex;align-items:baseline;gap:14px}
  .rail .n{margin-top:0}
}
</style>
</head>
<body>
<div class="spine"><span id="spine"></span></div>
<div class="shell"><div id="app"></div></div>
<script>
const DATA = __GAP_ANALYSIS_DATA__;
const E = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DC = {never:["r","fails silently"],late:["i","surfaces late"],mid:["","surfaces in test"],now:["","surfaces now"]};
const PV = {stated:["","stated"],implied:["i","implied"],assumed:["r","bridged"]};
const tag=(c,t)=>t?`<span class="tag ${c}">${E(t)}</span>`:"";

/* ---------------- domain story diagram ---------------- */
const CL={stated:"#2D2DD6",implied:"#8A8AEA",assumed:"#E0402A"};
function wrap(t,max){const w=String(t||"").split(/\s+/),o=[];let l="";
  for(const x of w){if((l+" "+x).trim().length>max){if(l)o.push(l);l=x}else l=(l?l+" ":"")+x}
  if(l)o.push(l);return o}
function aIcon(k,x,y,c){
  if(k==="system")return `<g stroke="${c}" fill="none" stroke-width="1.1"><rect x="${x-8}" y="${y-7}" width="16" height="11.5" rx="1.5"/><path d="M${x-4.5} ${y+7.5}h9M${x} ${y+4.5}v3"/></g>`;
  if(k==="people")return `<g stroke="${c}" fill="none" stroke-width="1.1"><circle cx="${x-4}" cy="${y-4.5}" r="3"/><circle cx="${x+4.5}" cy="${y-4.5}" r="3"/><path d="M${x-10} ${y+7}c0-3.6 2.7-5.4 6.3-5.4s6.3 1.8 6.3 5.4"/></g>`;
  return `<g stroke="${c}" fill="none" stroke-width="1.1"><circle cx="${x}" cy="${y-4.5}" r="3.5"/><path d="M${x-6.2} ${y+7}c0-4 2.7-6.2 6.2-6.2s6.2 2.2 6.2 6.2"/></g>`;
}
function wIcon(k,x,y,c){
  if(k==="info")return `<path d="M${x-5.5} ${y-4.5}h11v7h-4.5l-2.7 2.7v-2.7h-3.8z" fill="none" stroke="${c}" stroke-width="1"/>`;
  if(k==="physical")return `<rect x="${x-5.5}" y="${y-4.5}" width="11" height="9" rx="1" fill="none" stroke="${c}" stroke-width="1"/>`;
  if(k==="digital")return `<g fill="none" stroke="${c}" stroke-width="1"><rect x="${x-5.5}" y="${y-4.5}" width="11" height="9" rx="1.5"/><circle cx="${x}" cy="${y}" r="1.4"/></g>`;
  return `<path d="M${x-4.5} ${y-5.5}h6.4l2.6 2.6v8.4h-9z" fill="none" stroke="${c}" stroke-width="1"/>`;
}
function storySVG(flow,gm){
  const ev=(flow.events||[]).slice().sort((a,b)=>(a.seq||0)-(b.seq||0));
  if(!ev.length) return "";
  let acts=(flow.actors||[]).slice();
  if(!acts.length){const seen={};ev.forEach(e=>{[[e.subject,e.subject_kind],[e.object,e.object_kind]].forEach(([n,k])=>{
    if(n&&!seen[n]){seen[n]=1;acts.push({name:n,kind:k||"person"})}})})}
  const n=Math.max(1,acts.length), W=960, PL=26, PR=26, HH=74;
  const lw=(W-PL-PR)/n, ax=i=>PL+lw*(i+.5), ix={};
  acts.forEach((a,i)=>ix[a.name]=i);
  const rows=ev.map(e=>{
    const gp=(e.gaps||[]).map(g=>gm[g]).filter(Boolean);
    const notes=[];
    if(e.basis) notes.push({k:"b",lines:wrap("bridged — "+e.basis,112)});
    if(e.annotation) notes.push({k:"a",lines:wrap(e.annotation,112)});
    gp.forEach(g=>notes.push({k:"g",g,lines:wrap(g.id+"  "+g.claim,108),
      cl:g.closure?wrap("to close: "+g.closure,108):[]}));
    let h=58; notes.forEach(t=>h+=12+(t.lines.length+(t.cl?t.cl.length:0))*13);
    return {e,notes,h,gp};
  });
  const H=HH+rows.reduce((s,r)=>s+r.h,0)+16;
  let s=`<svg class="story" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="domain story: ${E(flow.name)}">
  <defs><marker id="a1" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0.4L6.6 3.5L0 6.6z" fill="context-stroke"/></marker></defs>`;
  acts.forEach((a,i)=>{const x=ax(i);
    s+=`<line x1="${x}" y1="${HH-10}" x2="${x}" y2="${H-10}" stroke="#E5E8F1" stroke-width="1"/>`;
    s+=aIcon(a.kind,x,26,"#2D2DD6");
    wrap(a.name.toLowerCase(),Math.max(9,Math.floor(lw/6))).slice(0,2).forEach((l,k)=>{
      s+=`<text x="${x}" y="${48+k*11}" text-anchor="middle" font-size="9.5" letter-spacing="1.1" font-weight="600" fill="#5D6484">${E(l.toUpperCase())}</text>`});
  });
  let y=HH;
  rows.forEach(r=>{
    const e=r.e, c=CL[e.provenance]||CL.assumed, dash=e.provenance==="stated"?"":' stroke-dasharray="4 3.5"';
    const i1=ix[e.subject]??0, i2=(e.object!=null&&ix[e.object]!=null)?ix[e.object]:i1;
    const x1=ax(i1), x2=ax(i2), ay=y+30, self=i1===i2;
    if(r.gp.length){
      s+=`<rect x="0" y="${y}" width="${W}" height="${r.h-4}" fill="#FCF0EE"/>`;
      s+=`<rect x="0" y="${y}" width="2" height="${r.h-4}" fill="#E0402A"/>`;
      s+=`<text x="12" y="${y+r.h-12}" font-size="8.5" letter-spacing="1.6" font-weight="700" fill="#E0402A" transform="rotate(-90 12 ${y+r.h-12})">NOW</text>`;
    }
    const lb=((e.work_object||"").trim()||"—").toLowerCase();
    const cw=Math.min(lw*1.35,Math.max(58,lb.length*6+32));
    const mx=self?x1+62+cw/2:(x1+x2)/2, dir=x2>=x1?1:-1;
    if(self){
      s+=`<path d="M${x1} ${ay-9}q30 0 30 11 q0 11 -30 11" fill="none" stroke="${c}" stroke-width="1.2"${dash}/>`;
      s+=`<line x1="${x1+30}" y1="${ay+2}" x2="${mx-cw/2}" y2="${ay+2}" stroke="${c}" stroke-width="1.2"${dash}/>`;
    }else{
      s+=`<line x1="${x1+dir*10}" y1="${ay}" x2="${mx-dir*cw/2}" y2="${ay}" stroke="${c}" stroke-width="1.2"${dash}/>`;
      s+=`<line x1="${mx+dir*cw/2}" y1="${ay}" x2="${x2-dir*12}" y2="${ay}" stroke="${c}" stroke-width="1.2"${dash} marker-end="url(#a1)"/>`;
    }
    const cy=self?ay+2:ay;
    s+=`<rect x="${mx-cw/2}" y="${cy-10}" width="${cw}" height="20" rx="10" fill="#FBFCFE" stroke="${c}" stroke-width="1"/>`;
    s+=wIcon(e.work_object_kind,mx-cw/2+13,cy,c);
    s+=`<text x="${mx+7}" y="${cy+3.5}" text-anchor="middle" font-size="10.5" fill="#232848">${E(lb)}</text>`;
    if(e.verb) s+=`<text x="${mx}" y="${cy-16}" text-anchor="middle" font-size="10" font-style="italic" fill="#9AA0B8">${E(String(e.verb).toLowerCase())}</text>`;
    s+=`<circle cx="${x1}" cy="${ay}" r="9" fill="#FBFCFE" stroke="${c}" stroke-width="1.2"/>`;
    s+=`<text x="${x1}" y="${ay+3.4}" text-anchor="middle" font-size="10" font-weight="600" fill="${c}">${e.seq||""}</text>`;
    let ny=y+46;
    r.notes.forEach(t=>{
      const col=t.k==="g"?"#E0402A":t.k==="b"?"#E0402A":"#9AA0B8";
      t.lines.forEach((l,k)=>{s+=`<text x="${PL}" y="${ny+7+k*13}" font-size="10.5" fill="${col}"${t.k==="g"?' font-weight="600"':""}>${E(l)}</text>`});
      let off=t.lines.length;
      (t.cl||[]).forEach((l,k)=>{s+=`<text x="${PL}" y="${ny+7+(off+k)*13}" font-size="10" fill="#5D6484">${E(l)}</text>`});
      ny+=12+(off+(t.cl?t.cl.length:0))*13;
    });
    y+=r.h;
  });
  return s+`</svg>`;
}

/* ---------------- sections ---------------- */
function sec(id,num,label,note,title,intro,inner){
  return `<section id="${id}">
   <div class="rail"><div class="klabel">${E(label)}</div>${note?`<div class="n">${E(note)}</div>`:""}
     <div class="ghost">${E(num)}</div></div>
   <div><h2>${E(title)}</h2>${intro?`<p class="intro">${intro}</p>`:""}${inner}</div></section>`;
}
function hero(){
  const m=DATA.meta||{}, reg=DATA.register||[], q=DATA.questions||[];
  const never=reg.filter(g=>g.discovery_cost==="never").length;
  const un=q.filter(x=>(x.answerer||"UNASSIGNED")==="UNASSIGNED").length;
  const asm=(DATA.assumptions||[]).filter(a=>a.importance==="high"&&!(a.sources||[]).length).length;
  const f=(v,l,al)=>`<div class="fig${al&&v?" alarm":""}"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="hero"><div class="klabel">${E(m.mode||"run")} · ${E(m.run_id||"")} · ${E(m.date||"")}</div>
  <h1>gap<br>workshop</h1>
  <p class="lede">${E(m.project||"")} — reconstructed flows, open gaps, and the questions that <em>only humans</em> can answer.</p>
  <div class="figs">
   ${f((DATA.corpus||{}).doc_count||0,"documents")}
   ${f((DATA.flows||[]).length,"flows")}
   ${f(reg.length,"gaps")}
   ${f(never,"fails silently",1)}
   ${f(asm,"untested beliefs")}
   ${f(un,"unrouted",1)}
  </div></div>`;
}
function nav(){
  const ids=[["contradictions","contradictions"],["flows","flows"],["register","gaps"],
  ["assumptions","assumptions"],["questions","questions"]];
  if(DATA.changes) ids.push(["changes","changes"]);
  return `<nav>${ids.map(([i,t])=>`<a href="#${i}">${t}</a>`).join("")}</nav>`;
}
function contradictions(){
  const cs=DATA.contradictions||[];
  const inner=!cs.length?`<p class="empty">no direct contradictions found across the corpus.</p>`:
   `<div class="panel pad"><table><thead><tr><th>ref</th><th>claim a</th><th>claim b</th><th>why it matters</th></tr></thead><tbody>
    ${cs.map(c=>`<tr><td class="nw"><span class="ref">${E(c.id)}</span><div style="margin-top:7px">${tag("",c.kind)}</div></td>
     <td>${E((c.claim_a||{}).text)}<div class="dim2"><code>${E((c.claim_a||{}).source)}</code></div></td>
     <td>${E((c.claim_b||{}).text)}<div class="dim2"><code>${E((c.claim_b||{}).source)}</code></div></td>
     <td class="dim">${E(c.note||"")}</td></tr>`).join("")}</tbody></table></div>`;
  return sec("contradictions","01","§ 01 — no inference",cs.length?cs.length+" found":"none found","contradictions",
   `The only findings here that require <b>no reconstruction at all</b>: two documents in the corpus assert things that cannot both be true. Act on these without trusting anything further down the page.`,inner);
}
function flows(){
  const fs=DATA.flows||[];
  const gm={};(DATA.register||[]).forEach(g=>gm[g.id]=g);
  const inner=!fs.length?`<p class="empty">no flows reconstructed.</p>`:fs.map(f=>{
    const ar=Math.round((f.assumed_ratio||0)*100);
    const gc=(f.events||[]).reduce((s,e)=>s+((e.gaps||[]).length),0);
    return `<div class="flow"><div class="fhd"><span class="ft">${E(f.name)}</span>
      ${tag(ar>=60?"r":ar>=30?"i":"",ar+"% bridged")}${gc?tag("r",gc+" gaps"):""}</div>
      <div class="fbd">${f.scope?`<p class="dim" style="margin:8px 8px 4px">${E(f.scope)}</p>`:""}
      ${storySVG(f,gm)}
      <div class="legend">
       <span><i style="border-top:1.5px solid #2D2DD6"></i>stated</span>
       <span><i style="border-top:1.5px dashed #8A8AEA"></i>implied</span>
       <span><i style="border-top:1.5px dashed #E0402A"></i>bridged</span>
       <span style="color:#E0402A">tinted row — gap attached</span>
      </div></div></div>`;
  }).join("");
  return sec("flows","02","§ 02 — domain stories",fs.length+" reconstructed","flows",
   `Each row is one sentence: <b>actor</b> — verb — <b>work object</b> — <b>actor</b>, numbered in sequence. A dashed red arrow means <b>nothing in the corpus describes that step</b> — a finding about the documentation, not about the system. Gaps sit on the step where they bite.`,inner);
}
function register(){
  const gs=DATA.register||[];
  const rank={never:0,late:1,mid:2,now:3};
  const inner=!gs.length?`<p class="empty">no gaps recorded.</p>`:
   `<div class="panel pad"><table><thead><tr><th>ref</th><th>gap</th><th>seam</th><th>cost</th><th>to close</th><th>owner</th></tr></thead><tbody>
   ${gs.slice().sort((a,b)=>(rank[a.discovery_cost]??9)-(rank[b.discovery_cost]??9)).map(g=>{
     const d=DC[g.discovery_cost]||DC.now, p=PV[g.provenance]||PV.assumed;
     const done=g.status==="closed"||g.status==="accepted";
     return `<tr class="${done?"faded":""}">
      <td class="nw"><span class="ref">${E(g.id)}</span>${g.discovery_cost==="never"?`<div style="margin-top:8px"><span class="now">now</span></div>`:""}</td>
      <td><div class="ttl">${E(g.claim)}</div>
        ${g.basis?`<div class="dim">${E(g.basis)}</div>`:""}
        ${(g.sources||[]).length?`<div class="dim2">${g.sources.map(s=>`<code>${E(s)}</code>`).join(" ")}</div>`:""}</td>
      <td class="nw"><div class="dim" style="margin:0">${E(g.seam||"—")}</div><div style="margin-top:7px">${tag("",g.type)}</div></td>
      <td class="nw">${tag(d[0],d[1])}<div style="margin-top:7px">${tag(p[0],p[1])}</div></td>
      <td>${E(g.closure||"—")}${g.closure_kind?`<div style="margin-top:7px">${tag("",g.closure_kind)}</div>`:""}</td>
      <td class="nw"><div class="dim" style="margin:0">${E(g.owner||"unassigned")}</div><div style="margin-top:7px">${tag(g.status&&g.status!=="open"?"i":"",g.status||"open")}</div></td></tr>`}).join("")}
   </tbody></table></div>`;
  return sec("register","03","§ 03 — the register",gs.length+" open items","gaps",
   `Ordered by <b>when you would find out anyway</b>. A gap that fails silently outranks a more severe one that announces itself, because the loud one gets fixed for free during normal work. Priority ordering is deliberately left to you.`,inner);
}
function assumptions(){
  const as=DATA.assumptions||[];
  const inner=!as.length?`<p class="empty">no assumptions mapped.</p>`:
   `<div class="panel pad"><table><thead><tr><th>ref</th><th>belief</th><th>weight</th><th>evidence</th><th>falsified by</th></tr></thead><tbody>
   ${as.slice().sort((a,b)=>{const s=x=>(x.importance==="high"?0:2)+((x.sources||[]).length?1:0);return s(a)-s(b)}).map(a=>{
     const ns=(a.sources||[]).length, hot=a.importance==="high"&&!ns;
     return `<tr class="${!hot&&ns?"":""}">
      <td class="nw"><span class="ref">${E(a.id)}</span></td>
      <td><div class="${hot?"ttl":""}" style="${hot?"":"color:var(--ink-2)"}">${E(a.claim)}</div>
        ${a.origin?`<div class="dim2"><code>${E(a.origin)}</code></div>`:""}
        ${(a.links||[]).length?`<div class="dim2">${a.links.map(l=>E(l)).join(" · ")}</div>`:""}</td>
      <td class="nw">${tag(a.importance==="high"?"f":"",a.importance||"low")}</td>
      <td class="nw">${tag(ns?"":"r",ns?ns+" source"+(ns>1?"s":""):"none")}</td>
      <td class="dim">${E(a.falsifier||"—")}</td></tr>`}).join("")}
   </tbody></table></div>`;
  return sec("assumptions","04","§ 04 — load-bearing beliefs","evidence is a source count, never a confidence score","assumptions",
   `Top rows are <b>important and unevidenced</b> — the design rests on them and nothing in the corpus supports them. Evidence is counted as independent corpus sources, so a reviewer can check it.`,inner);
}
function questions(){
  const qs=DATA.questions||[];
  if(!qs.length) return sec("questions","05","§ 05 — the deliverable","","questions","",`<p class="empty">no questions generated.</p>`);
  const by={};qs.forEach(q=>{(by[q.answerer||"UNASSIGNED"]=by[q.answerer||"UNASSIGNED"]||[]).push(q)});
  const order=Object.keys(by).sort((a,b)=>a==="UNASSIGNED"?-1:b==="UNASSIGNED"?1:by[b].length-by[a].length);
  const inner=order.map(who=>{
    const open=by[who].filter(q=>q.status!=="deferred"), def=by[who].filter(q=>q.status==="deferred");
    return `<div class="qb"><div class="qh"><span class="qn">${E(who.toLowerCase())}</span>
      ${tag(who==="UNASSIGNED"?"r":"f",open.length+" to answer")}${def.length?tag("",def.length+" deferred"):""}</div>
      <div class="panel pad"><table><tbody>
      ${open.map(q=>`<tr class="${q.status==="answered"?"faded":""}">
        <td class="nw" style="width:70px"><span class="ref">${E(q.id)}</span></td>
        <td><div class="ttl">${E(q.question)}</div>
          ${q.we_believe?`<div class="dim">we believe — ${E(q.we_believe)}</div>`:""}
          <div class="dim2">${(q.links||[]).map(l=>E(l)).join(" · ")}</div></td>
        <td class="dim" style="width:34%">${E(q.consequence||"—")}</td></tr>`).join("")}
      ${def.map(q=>`<tr class="faded"><td class="nw"><span class="ref">${E(q.id)}</span></td>
        <td colspan="2"><div class="ttl">${E(q.question)}</div><div class="dim2">deferred</div></td></tr>`).join("")}
      </tbody></table></div></div>`;
  }).join("");
  const un=by.UNASSIGNED?`<p class="intro" style="color:var(--red)"><b style="color:var(--red)">${by.UNASSIGNED.length} question${by.UNASSIGNED.length>1?"s have":" has"} no owner.</b> A question nobody can answer marks an unowned area — worth registering as an ownership gap in its own right.</p>`:"";
  return sec("questions","05","§ 05 — the deliverable",qs.length+" questions, routed","questions",
   `Grouped by <b>who can answer</b>, not by topic. Open your own section, answer what you know, ignore the rest. Every question states what changes depending on the answer.`+un,inner);
}
function changes(){
  const c=DATA.changes;if(!c)return"";
  const b=(t,arr,cl)=>arr&&arr.length?`<tr><td class="nw">${tag(cl,t)}</td><td>${arr.map(x=>`<div style="margin-bottom:6px"><span class="ref">${E(x.id)}</span> ${E(x.claim||x.note||"")}</div>`).join("")}</td></tr>`:"";
  const rows=b("new",c.new,"r")+b("basis changed",c.basis_changed,"i")+b("resolved",c.resolved,"");
  if(!rows)return"";
  return sec("changes","06","§ 06 — drift","","changes since last run",
   `Records whose basis moved since the previous run. Nothing here is closed automatically.`,
   `<div class="panel pad"><table><tbody>${rows}</tbody></table></div>`);
}
function foot(){
  const m=DATA.meta||{};
  return `<footer><div class="klabel plain">end of report</div>
  <p class="fn" style="margin-top:16px">This is a machine-assisted reading of the corpus, not a verified account of the system.
  Bridged steps, unevidenced beliefs and unrouted questions all mark places where a human still has to look.
  Nothing here is closed until someone with evidence closes it.</p>
  <div class="fw">gap-analysis.</div></footer>`;
}
document.getElementById("app").innerHTML =
  hero()+nav()+contradictions()+flows()+register()+assumptions()+questions()+changes()+foot();
document.getElementById("spine").textContent =
  ((DATA.meta||{}).project||"gap-analysis")+"  ·  "+((DATA.meta||{}).run_id||"");
</script>
</body>
</html>
