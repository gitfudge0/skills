<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gap-analysis</title>
<link rel="stylesheet" href="../../../plan/runtime/htmlplan.css">
<script src="../../../plan/runtime/htmlplan.js" defer></script>
<style>
/* Diagram exhibit only. Page chrome and typography belong to htmlplan. */
.gap-story { overflow-x:auto; }
.gap-story svg.story { display:block; width:100%; min-width:640px; height:auto; }
</style>
</head>
<body>
<header id="report-header"><h1>Gap analysis workshop</h1></header>
<main><doc-plan id="app" open="1"></doc-plan></main>
<script>
const DATA = __GAP_ANALYSIS_DATA__;
const E = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DC = {never:["r","fails silently"],late:["i","surfaces late"],mid:["","surfaces in test"],now:["","surfaces now"]};
const PV = {stated:["","stated"],implied:["i","implied"],assumed:["r","bridged"]};
const tag=(c,t)=>t?`<span class="pill ${{r:"red",i:"amber",f:"accent"}[c]||""}">${E(t)}</span>`:"";

/* ---------------- domain story diagram ---------------- */
const CL={stated:"var(--accent)",implied:"var(--amber)",assumed:"var(--red)"};
function wrap(t,max){const w=String(t||"").split(/\s+/),o=[];let l="";
  for(const x of w){if((l+" "+x).trim().length>max){if(l)o.push(l);l=x}else l=(l?l+" ":"")+x}
  if(l)o.push(l);return o}
function aIcon(k,x,y,c){
  if(k==="system")return `<g stroke="${c}" fill="none" stroke-width="1.1"><rect x="${x-8}" y="${y-7}" width="16" height="11.5" rx="1.5"/><path d="M${x-4.5} ${y+7.5}h9M${x} ${y+4.5}v3"/></g>`;
  if(k==="people")return `<g stroke="${c}" fill="none" stroke-width="1.1"><circle cx="${x-4}" cy="${y-4.5}" r="3"/><circle cx="${x+4.5}" cy="${y-4.5}" r="3"/><path d="M${x-10} ${y+7}c0-3.6 2.7-5.4 6.3-5.4s6.3 1.8 6.3 5.4"/></g>`;
  return `<g stroke="${c}" fill="none" stroke-width="1.1"><circle cx="${x}" cy="${y-4.5}" r="3.5"/><path d="M${x-6.2} ${y+7}c0-4 2.7-6.2 6.2-6.2s6.2 2.2 6.2 6.2"/></g>`;
}
function wIcon(k,x,y,c){
  if(k==="info")return `<path d="M${x-5.5} ${y-4.5}h11v7h-4.5l-2.7 2.7v-2.7h-3.8z" fill="none" stroke="${c}" stroke-width="1"/>`;
  if(k==="physical")return `<rect x="${x-5.5}" y="${y-4.5}" width="11" height="9" rx="1" fill="none" stroke="${c}" stroke-width="1"/>`;
  if(k==="digital")return `<g fill="none" stroke="${c}" stroke-width="1"><rect x="${x-5.5}" y="${y-4.5}" width="11" height="9" rx="1.5"/><circle cx="${x}" cy="${y}" r="1.4"/></g>`;
  return `<path d="M${x-4.5} ${y-5.5}h6.4l2.6 2.6v8.4h-9z" fill="none" stroke="${c}" stroke-width="1"/>`;
}
function storySVG(flow,gm){
  const ev=(flow.events||[]).slice().sort((a,b)=>(a.seq||0)-(b.seq||0));
  if(!ev.length) return "";
  let acts=(flow.actors||[]).slice();
  if(!acts.length){const seen=Object.create(null);ev.forEach(e=>{[[e.subject,e.subject_kind],[e.object,e.object_kind]].forEach(([n,k])=>{
    if(n&&!seen[n]){seen[n]=1;acts.push({name:n,kind:k||"person"})}})})}
  const n=Math.max(1,acts.length), W=960, PL=26, PR=26, HH=74;
  const lw=(W-PL-PR)/n, ax=i=>PL+lw*(i+.5), ix=Object.create(null);
  acts.forEach((a,i)=>ix[a.name]=i);
  const rows=ev.map(e=>{
    const gp=(e.gaps||[]).map(g=>gm[g]).filter(Boolean);
    const notes=[];
    if(e.basis) notes.push({k:"b",lines:wrap("bridged — "+e.basis,112)});
    if((e.sources||[]).length) notes.push({k:"a",lines:wrap("sources — "+e.sources.join(" · "),112)});
    if(e.annotation) notes.push({k:"a",lines:wrap(e.annotation,112)});
    gp.forEach(g=>notes.push({k:"g",g,lines:wrap(g.id+"  "+g.claim,108),
      cl:g.closure?wrap("to close: "+g.closure,108):[]}));
    let h=58; notes.forEach(t=>h+=12+(t.lines.length+(t.cl?t.cl.length:0))*13);
    return {e,notes,h,gp};
  });
  const H=HH+rows.reduce((s,r)=>s+r.h,0)+16;
  let s=`<svg class="story" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="domain story: ${E(flow.name)}">
  <defs><marker id="a1" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0.4L6.6 3.5L0 6.6z" fill="context-stroke"/></marker></defs>`;
  acts.forEach((a,i)=>{const x=ax(i);
    s+=`<line x1="${x}" y1="${HH-10}" x2="${x}" y2="${H-10}" stroke="var(--line-2)" stroke-width="1"/>`;
    s+=aIcon(a.kind,x,26,"var(--accent)");
    wrap(a.name.toLowerCase(),Math.max(9,Math.floor(lw/6))).slice(0,2).forEach((l,k)=>{
      s+=`<text x="${x}" y="${48+k*11}" text-anchor="middle" font-size="9.5" letter-spacing="1.1" font-weight="600" fill="var(--ink-2)">${E(l.toUpperCase())}</text>`});
  });
  let y=HH;
  rows.forEach(r=>{
    const e=r.e, c=CL[e.provenance]||CL.assumed, dash=e.provenance==="stated"?"":' stroke-dasharray="4 3.5"';
    const i1=ix[e.subject]??0, i2=(e.object!=null&&ix[e.object]!=null)?ix[e.object]:i1;
    const x1=ax(i1), x2=ax(i2), ay=y+30, self=i1===i2;
    if(r.gp.length){
      s+=`<rect x="0" y="${y}" width="${W}" height="${r.h-4}" fill="var(--red-soft)"/>`;
      s+=`<rect x="0" y="${y}" width="2" height="${r.h-4}" fill="var(--red)"/>`;
      s+=`<text x="12" y="${y+r.h-12}" font-size="8.5" letter-spacing="1.6" font-weight="700" fill="var(--red)" transform="rotate(-90 12 ${y+r.h-12})">NOW</text>`;
    }
    const lb=((e.work_object||"").trim()||"—").toLowerCase();
    const cw=Math.min(lw*1.35,Math.max(58,lb.length*6+32));
    const mx=self?x1+62+cw/2:(x1+x2)/2, dir=x2>=x1?1:-1;
    if(self){
      s+=`<path d="M${x1} ${ay-9}q30 0 30 11 q0 11 -30 11" fill="none" stroke="${c}" stroke-width="1.2"${dash}/>`;
      s+=`<line x1="${x1+30}" y1="${ay+2}" x2="${mx-cw/2}" y2="${ay+2}" stroke="${c}" stroke-width="1.2"${dash}/>`;
    }else{
      s+=`<line x1="${x1+dir*10}" y1="${ay}" x2="${mx-dir*cw/2}" y2="${ay}" stroke="${c}" stroke-width="1.2"${dash}/>`;
      s+=`<line x1="${mx+dir*cw/2}" y1="${ay}" x2="${x2-dir*12}" y2="${ay}" stroke="${c}" stroke-width="1.2"${dash} marker-end="url(#a1)"/>`;
    }
    const cy=self?ay+2:ay;
    s+=`<rect x="${mx-cw/2}" y="${cy-10}" width="${cw}" height="20" rx="10" fill="var(--card)" stroke="${c}" stroke-width="1"/>`;
    s+=wIcon(e.work_object_kind,mx-cw/2+13,cy,c);
    s+=`<text x="${mx+7}" y="${cy+3.5}" text-anchor="middle" font-size="10.5" fill="var(--ink)">${E(lb)}</text>`;
    if(e.verb) s+=`<text x="${mx}" y="${cy-16}" text-anchor="middle" font-size="10" font-style="italic" fill="var(--ink-2)">${E(String(e.verb).toLowerCase())}</text>`;
    s+=`<circle cx="${x1}" cy="${ay}" r="9" fill="var(--card)" stroke="${c}" stroke-width="1.2"/>`;
    s+=`<text x="${x1}" y="${ay+3.4}" text-anchor="middle" font-size="10" font-weight="600" fill="${c}">${E(e.seq||"")}</text>`;
    let ny=y+46;
    r.notes.forEach(t=>{
      const col=t.k==="g"?"var(--red)":t.k==="b"?"var(--red)":"var(--ink-2)";
      t.lines.forEach((l,k)=>{s+=`<text x="${PL}" y="${ny+7+k*13}" font-size="10.5" fill="${col}"${t.k==="g"?' font-weight="600"':""}>${E(l)}</text>`});
      let off=t.lines.length;
      (t.cl||[]).forEach((l,k)=>{s+=`<text x="${PL}" y="${ny+7+(off+k)*13}" font-size="10" fill="var(--ink-2)">${E(l)}</text>`});
      ny+=12+(off+(t.cl?t.cl.length:0))*13;
    });
    y+=r.h;
  });
  return s+`</svg>`;
}

/* ---------------- sections ---------------- */
function sec(id,num,label,note,title,intro,inner){
  return `<doc-claim id="${E(id)}"${id==="changes"?' aux="changes"':""}>
    <p>${E(title)}${note?` <span class="pill">${E(note)}</span>`:""}</p>
    ${intro?`<doc-note>${intro}</doc-note>`:""}${inner}</doc-claim>`;
}
function hero(){
  const m=DATA.meta||{}, reg=DATA.register||[];
  return `<h1>Gap analysis workshop</h1><p class="dek">${E(m.project||"Corpus review")} — reconstructed flows, gaps, and questions requiring human evidence.</p>
    <p class="meta">${E(m.mode||"run")} · ${E(m.run_id||"")} · ${E(m.date||"")}</p>
    <p>${tag("",((DATA.corpus||{}).doc_count||0)+" documents")} ${tag("",(DATA.flows||[]).length+" flows")} ${tag("",reg.length+" gaps")}
    ${tag("r",reg.filter(g=>g.discovery_cost==="never").length+" fail silently")}
    ${tag("",(DATA.assumptions||[]).filter(a=>a.importance==="high"&&!(a.sources||[]).length).length+" untested beliefs")}
    ${tag("r",(DATA.questions||[]).filter(q=>(q.answerer||"UNASSIGNED")==="UNASSIGNED").length+" unrouted")}</p>`;
}
function contradictions(){
  const cs=DATA.contradictions||[];
  const inner=!cs.length?`<p class="muted">no direct contradictions found across the corpus.</p>`:
   `<div class="table-wrap"><table><thead><tr><th>ref</th><th>claim a</th><th>claim b</th><th>why it matters</th></tr></thead><tbody>
    ${cs.map(c=>`<tr><td class="nw"><span class="ref">${E(c.id)}</span><div style="margin-top:7px">${tag("",c.kind)}</div></td>
     <td>${E((c.claim_a||{}).text)}<div class="meta"><code>${E((c.claim_a||{}).source)}</code></div></td>
     <td>${E((c.claim_b||{}).text)}<div class="meta"><code>${E((c.claim_b||{}).source)}</code></div></td>
     <td class="muted">${E(c.note||"")}</td></tr>`).join("")}</tbody></table></div>`;
  return sec("contradictions","01","§ 01 — no inference",cs.length?cs.length+" found":"none found","contradictions",
   `The only findings here that require <b>no reconstruction at all</b>: two documents in the corpus assert things that cannot both be true. Act on these without trusting anything further down the page.`,inner);
}
function flows(){
  const fs=DATA.flows||[];
  const gm=Object.create(null);(DATA.register||[]).forEach(g=>gm[g.id]=g);
  const inner=!fs.length?`<p class="muted">no flows reconstructed.</p>`:fs.map(f=>{
    const ar=Math.round((f.assumed_ratio||0)*100);
    const gc=(f.events||[]).reduce((s,e)=>s+((e.gaps||[]).length),0);
    return `<div class="card"><div class="fhd"><span class="ft">${E(f.name)}</span>
      ${tag(ar>=60?"r":ar>=30?"i":"",ar+"% bridged")}${gc?tag("r",gc+" gaps"):""}</div>
      <div class="gap-story">${f.scope?`<p class="muted" style="margin:8px 8px 4px">${E(f.scope)}</p>`:""}
      ${storySVG(f,gm)}
      <div class="meta">
       <span><i style="border-top:1.5px solid var(--accent)"></i>stated</span>
       <span><i style="border-top:1.5px dashed var(--amber)"></i>implied</span>
       <span><i style="border-top:1.5px dashed var(--red)"></i>bridged</span>
       <span style="color:var(--red)">tinted row — gap attached</span>
      </div></div></div>`;
  }).join("");
  return sec("flows","02","§ 02 — domain stories",fs.length+" reconstructed","flows",
   `Each row is one sentence: <b>actor</b> — verb — <b>work object</b> — <b>actor</b>, numbered in sequence. A dashed red arrow means <b>nothing in the corpus describes that step</b> — a finding about the documentation, not about the system. Gaps sit on the step where they bite.`,inner);
}
function answerEvidence(questionIds){
  return (DATA.answers||[]).filter(a=>questionIds.includes(a.id)).map(a=>
    `<div class="muted"><b>Answer received · ${E(a.id)}</b><div>${E(a.answer)}</div>
      <div>${E(a.answered_by||"respondent unavailable")} · ${E(a.date||"date unavailable")}</div>
      <div>${(a.evidence||[]).length?a.evidence.map(e=>`<code>${E(e)}</code>`).join(" "):"supporting evidence unavailable"}</div>
      <div>${tag(a.assessment==="conflicting"?"r":"",a.assessment||"unassessed")}${a.assessment_basis?` ${E(a.assessment_basis)}`:""}</div></div>`).join("");
}
function register(){
  const gs=DATA.register||[];
  const rank={never:0,late:1,mid:2,now:3};
  const inner=!gs.length?`<p class="muted">no gaps recorded.</p>`:
   `<div class="table-wrap"><table><thead><tr><th>ref</th><th>gap</th><th>seam</th><th>cost</th><th>to close</th><th>owner</th></tr></thead><tbody>
   ${gs.slice().sort((a,b)=>(rank[a.discovery_cost]??9)-(rank[b.discovery_cost]??9)).map(g=>{
     const d=DC[g.discovery_cost]||DC.now, p=PV[g.provenance]||PV.assumed;
     const done=g.status==="closed"||g.status==="accepted";
     return `<tr class="${done?"faded":""}">
      <td class="nw"><span class="ref">${E(g.id)}</span>${g.discovery_cost==="never"?`<div style="margin-top:8px"><span class="now">now</span></div>`:""}</td>
      <td><div class="">${E(g.claim)}</div>
        ${g.basis?`<div class="muted">${E(g.basis)}</div>`:""}
        ${(g.sources||[]).length?`<div class="meta">${g.sources.map(s=>`<code>${E(s)}</code>`).join(" ")}</div>`:""}</td>
      <td class="nw"><div class="muted" style="margin:0">${E(g.seam||"—")}</div><div style="margin-top:7px">${tag("",g.type)}</div></td>
      <td class="nw">${tag(d[0],d[1])}<div style="margin-top:7px">${tag(p[0],p[1])}</div></td>
      <td>${E(g.closure||"—")}${answerEvidence((DATA.questions||[]).filter(q=>(q.links||[]).includes(g.id)).map(q=>q.id))}${g.closure_kind?`<div style="margin-top:7px">${tag("",g.closure_kind)}</div>`:""}</td>
      <td class="nw"><div class="muted" style="margin:0">${E(g.owner||"unassigned")}</div><div style="margin-top:7px">${tag(g.status&&g.status!=="open"?"i":"",g.status||"open")}</div>${g.basis_state?`<div>${tag("", "basis "+g.basis_state)}</div>`:""}${g.resolution?`<div>${tag("i", "resolution "+g.resolution)}</div>`:""}${(g.resolution_evidence||[]).map(e=>`<div class="meta">${E(e)}</div>`).join("")}</td></tr>`}).join("")}
   </tbody></table></div>`;
  return sec("register","03","§ 03 — the register",gs.filter(g=>g.status!=="closed"&&g.status!=="accepted").length+" open items","gaps",
   `Ordered by <b>when you would find out anyway</b>. A gap that fails silently outranks a more severe one that announces itself, because the loud one gets fixed for free during normal work. Priority ordering is deliberately left to you.`,inner);
}
function assumptions(){
  const as=DATA.assumptions||[];
  const inner=!as.length?`<p class="muted">no assumptions mapped.</p>`:
   `<div class="table-wrap"><table><thead><tr><th>ref</th><th>belief</th><th>weight</th><th>evidence</th><th>falsified by</th></tr></thead><tbody>
   ${as.slice().sort((a,b)=>{const s=x=>(x.importance==="high"?0:2)+((x.sources||[]).length?1:0);return s(a)-s(b)}).map(a=>{
     const ns=(a.sources||[]).length, hot=a.importance==="high"&&!ns;
     return `<tr class="${!hot&&ns?"":""}">
      <td class="nw"><span class="ref">${E(a.id)}</span></td>
      <td><div class="${hot?"ttl":""}" style="${hot?"":"color:var(--ink-2)"}">${E(a.claim)}</div>
        ${a.origin?`<div class="meta"><code>${E(a.origin)}</code></div>`:""}
        ${(a.links||[]).length?`<div class="meta">${a.links.map(l=>E(l)).join(" · ")}</div>`:""}</td>
      <td class="nw">${tag(a.importance==="high"?"f":"",a.importance||"low")}</td>
      <td class="nw">${tag(ns?"":"r",ns?ns+" source"+(ns>1?"s":""):"none")}</td>
      <td class="muted">${E(a.falsifier||"—")}</td></tr>`}).join("")}
   </tbody></table></div>`;
  return sec("assumptions","04","§ 04 — load-bearing beliefs","evidence is a source count, never a confidence score","assumptions",
   `Top rows are <b>important and unevidenced</b> — the design rests on them and nothing in the corpus supports them. Evidence counts source families for coverage, not proof of correctness or independence. Review ownership, dates, directness, and contradictions alongside the count.`,inner);
}
function questions(){
  const qs=DATA.questions||[];
  if(!qs.length) return sec("questions","05","§ 05 — the deliverable","","questions","",`<p class="muted">no questions generated.</p>`);
  const by=Object.create(null);qs.forEach(q=>{(by[q.answerer||"UNASSIGNED"]=by[q.answerer||"UNASSIGNED"]||[]).push(q)});
  const order=Object.keys(by).sort((a,b)=>a==="UNASSIGNED"?-1:b==="UNASSIGNED"?1:by[b].length-by[a].length);
  const inner=order.map(who=>{
    const open=by[who].filter(q=>q.status!=="deferred"), def=by[who].filter(q=>q.status==="deferred");
    return `<div class="qb"><div class="qh"><span class="qn">${E(who.toLowerCase())}</span>
      ${tag(who==="UNASSIGNED"?"r":"f",open.filter(q=>q.status!=="answered").length+" to answer")}${def.length?tag("",def.length+" deferred"):""}</div>
      <div class="table-wrap"><table><tbody>
      ${open.map(q=>`<tr class="${q.status==="answered"?"faded":""}">
        <td class="nw" style="width:70px"><span class="ref">${E(q.id)}</span></td>
        <td><div class="">${E(q.question)}</div>
          ${q.we_believe?`<div class="muted">we believe — ${E(q.we_believe)}</div>`:""}${answerEvidence([q.id])}
          <div class="meta">${(q.links||[]).map(l=>E(l)).join(" · ")}</div></td>
        <td class="muted" style="width:34%">${E(q.consequence||"—")}</td></tr>`).join("")}
      ${def.map(q=>`<tr class="faded"><td class="nw"><span class="ref">${E(q.id)}</span></td>
        <td colspan="2"><div class="">${E(q.question)}</div><div class="meta">deferred</div></td></tr>`).join("")}
      </tbody></table></div></div>`;
  }).join("");
  const un=by.UNASSIGNED?`<p class="intro" style="color:var(--red)"><b style="color:var(--red)">${by.UNASSIGNED.length} question${by.UNASSIGNED.length>1?"s have":" has"} no owner.</b> A question nobody can answer marks an unowned area — worth registering as an ownership gap in its own right.</p>`:"";
  return sec("questions","05","§ 05 — the deliverable",qs.length+" questions, routed","questions",
   `Grouped by <b>who can answer</b>, not by topic. Open your own section, answer what you know, ignore the rest. Every question states what changes depending on the answer.`+un,inner);
}
function changes(){
  const c=DATA.changes;if(!c)return"";
  const b=(t,arr,cl)=>arr&&arr.length?`<tr><td class="nw">${tag(cl,t)}</td><td>${arr.map(x=>`<div style="margin-bottom:6px"><span class="ref">${E(x.id)}</span> ${E(x.claim||x.note||"")}</div>`).join("")}</td></tr>`:"";
  const rows=b("new",c.new,"r")+b("basis changed",c.basis_changed,"i")+b("resolved",c.resolved,"");
  if(!rows)return"";
  return sec("changes","06","§ 06 — drift","","changes since last run",
   `Records whose basis moved since the previous run. Nothing here is closed automatically.`,
   `<div class="table-wrap"><table><tbody>${rows}</tbody></table></div>`);
}
function foot(){
  return `<doc-claim id="scope" aux="scope"><p>Evidence and response boundaries.</p>
    <doc-note>This is a machine-assisted reading of the corpus, not a verified account of the system.
    Bridged steps, unevidenced beliefs and unrouted questions require human evidence.
    Comments and copied responses are feedback; they do not update the canonical register.
    Preserve human dispositions and verify closure evidence before updating register.yaml.</doc-note></doc-claim>`;
}
document.getElementById("report-header").innerHTML = hero();
document.getElementById("app").innerHTML =
  contradictions()+flows()+register()+assumptions()+questions()+changes()+foot();
</script>
</body>
</html>
